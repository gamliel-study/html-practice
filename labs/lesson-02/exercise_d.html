<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Student Dashboard</title></head>
<body>
  <h1>Student Dashboard</h1>
  <label for="progress">Course completion:</label>
  <progress id="progress" value="45" max="100">45%</progress>
  <br>
  <label for="storage">Storage used:</label>
  <meter id="storage" value="0.9" min="0" max="1"
         low="0.25" high="0.75" optimum="0.2">90%</meter>
</body>
</html>
